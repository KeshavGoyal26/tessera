# CI for the Tessera monorepo. Each work package owns its job (ADR-0011);
# edits to other jobs go through a dedicated "ci:" commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    name: proto (buf lint, breaking, generated code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: Check generated Go code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          buf generate
          git diff --exit-code -- gen/go

  go:
    name: go (build, vet, lint, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: Test (race)
        run: go test -race -count=1 ./...
      - name: Benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime 1x ./pkg/...

  js:
    name: js (sdk lint, typecheck, build, test; demo build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/js/package-lock.json
            examples/web-demo/package-lock.json
      - name: SDK
        working-directory: sdk/js
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm run size
      - name: Check generated TypeScript is up to date
        working-directory: sdk/js
        run: |
          npm run generate
          git diff --exit-code -- src/gen
      - name: Demo
        working-directory: examples/web-demo
        run: |
          npm ci
          npm run build

  java:
    name: java (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Maven verify
        working-directory: sdk/java
        run: mvn -B -ntp verify

  e2e:
    name: e2e (browsers against tessera --dev)
    runs-on: ubuntu-latest
    needs: [js]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/js/package-lock.json
            examples/web-demo/package-lock.json
      - name: Install
        run: |
          (cd sdk/js && npm ci && npm run build)
          (cd examples/web-demo && npm ci)
          cd sdk/js && npx playwright install --with-deps chromium firefox
      - name: Playwright
        working-directory: sdk/js
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sdk/js/test-results

  recorder:
    name: recorder (ffmpeg-backed hls, recorder and storage tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test (race, fails if FFmpeg tests are skipped)
        run: |
          go test -race -count=1 -v ./pkg/hls/... ./pkg/recorder/... ./pkg/storage/... 2>&1 | tee test.log
          ! grep -E -- '--- SKIP' test.log

  e2e:
    name: e2e (real server + Pion clients, full system incl. HLS recording)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: E2E tests (race)
        run: go test -race -count=1 -v -timeout 5m ./test/e2e/

  dashboard-web:
    name: dashboard web (typecheck, test, build, embedded dist is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install, typecheck, test, build
        working-directory: web/admin
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Embedded dist is up to date
        run: git diff --exit-code -- pkg/dashboard/dist
