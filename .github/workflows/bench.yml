name: bench

# Forwarding-path benchmark regression gate (benchstat vs docs/perf/baseline/bench.txt).
# Separate workflow so it stays out of the critical path of ci.yml; target runtime ~1-2 min.
on:
  push:
    branches: [main]
    paths: ["pkg/**", "go.mod", "go.sum", "docs/perf/**", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["pkg/**", "go.mod", "go.sum", "docs/perf/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (benchstat regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@be2c69fb417e
      - name: Run benchmarks and compare with baseline
        env:
          BENCH_MAX_REGRESSION: "40"
        run: docs/perf/benchgate.sh
      - name: Upload results (use as the next baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-new.txt
