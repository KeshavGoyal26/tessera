# Local stack: tessera server (with built-in recording), MinIO, web demo, Prometheus and Grafana.
#   cp deploy/.env.example deploy/.env        # then edit TESSERA_NODE_IP
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# Media needs reachable UDP; on Linux servers host networking is simplest (see deploy/README.md).
name: tessera
services:
  tessera:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: tessera
    command: ["--config", "/etc/tessera/tessera.yaml"]
    environment:
      TESSERA_DEV_SECRET: ${TESSERA_DEV_SECRET}
      TESSERA_NODE_IP: ${TESSERA_NODE_IP}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/tessera.yaml:/etc/tessera/tessera.yaml:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "127.0.0.1:6789:6789/tcp"
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
                  mc mb --ignore-existing local/recordings &&
                  mc anonymous set download local/recordings"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  web-demo:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: web-demo
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/tessera-dashboard.json:/var/lib/grafana/dashboards/tessera-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  minio-data:
