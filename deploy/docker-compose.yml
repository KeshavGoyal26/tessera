# Single server (with built-in recording) and the web demo.
#   cp deploy/.env.example deploy/.env        # then edit TESSERA_NODE_IP
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# Web demo http://localhost:8080/?url=ws://localhost:7880; dashboard http://localhost:7880/admin/
# (devkey / TESSERA_DEV_SECRET). Recordings play from http://localhost:7880/recordings/.
name: tessera

services:
  tessera:
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: tessera }
    command: ["--config", "/etc/tessera/tessera.yaml"]
    environment:
      TESSERA_DEV_SECRET: ${TESSERA_DEV_SECRET}
      TESSERA_NODE_IP: ${TESSERA_NODE_IP}
    volumes: [./config/tessera.yaml:/etc/tessera/tessera.yaml:ro]
    ports: ["7880:7880/tcp", "7881:7881/tcp", "7882:7882/udp", "127.0.0.1:6789:6789/tcp"]
    restart: unless-stopped

  web-demo:
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: web-demo }
    ports: ["8080:80"]
    restart: unless-stopped
