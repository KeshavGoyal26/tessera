# Example tessera server configuration (deploy/docker-compose.yml). See pkg/config for all options.
development: true
port: 7880
keys:
  # Development key only. Production secrets must be >= 32 bytes and kept out of git.
  devkey: ${TESSERA_DEV_SECRET}
rtc:
  udp_port: 7882
  tcp_port: 7881
  # Advertised media address; set TESSERA_NODE_IP to the host's LAN/public IP.
  node_ip: ${TESSERA_NODE_IP}
turn:
  enabled: false
room:
  auto_create: true
  empty_timeout: 5m
webhook:
  api_key: devkey
  endpoints: []
  #  - url: http://host.docker.internal:8080/webhooks/tessera
  #    encoding: json
recording:
  enabled: true # recorded inside the server; no separate recorder
  # capacity: default 150 units per CPU (one unit per recorded track)
  storage:
    kind: local
    local_root: /tmp/recordings
    local_base_url: /recordings # served on the HTTP port (7880); use s3 in production
  # filename_prefix: "recordings/{shard}/{pid}/{start_ms}" # per presenter, with index.json (docs/RECORDING.md)
  hls:
    segment_duration: 4s
    audio_codec: opus
metrics:
  addr: ":6789"
  pprof: false # enable only on a trusted network
logging:
  level: info
