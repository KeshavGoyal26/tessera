<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Tessera Live</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/live.css" />
  </head>
  <body>
    <section id="landing" class="landing">
      <form id="join" class="card">
        <div class="brand"><span class="logo">▦</span> Tessera <span class="pill">Live</span></div>
        <p class="tag">Presenters stream to the server. Viewers pick one or more presenters to watch.</p>
        <label>
          Your name
          <input name="name" type="text" required maxlength="40" autocomplete="nickname" placeholder="Alex" />
        </label>
        <label class="check">
          <input name="record" type="checkbox" />
          <span>Record me when I present <small>(play it later in the admin dashboard)</small></span>
        </label>
        <div class="actions">
          <button class="primary" type="submit" value="presenter">Go live</button>
          <button class="secondary" type="submit" value="viewer">Watch</button>
        </div>
        <p class="switch"><a href="/call.html">Video call demo</a></p>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <!-- Presenter -->
    <section id="present" class="call" hidden>
      <header class="topbar">
        <span class="brand"><span class="logo">▦</span> Tessera</span>
        <span class="room-name" data-room></span>
        <span class="onair">LIVE</span>
        <span class="status" data-status role="status">disconnected</span>
      </header>
      <main class="stage" id="present-stage" data-count="1">
        <div class="tile self" id="preview">
          <div class="avatar" id="preview-avatar"></div>
          <div class="label"><span class="nm" id="preview-name"></span></div>
          <div class="rec" title="Your stream is being recorded">REC</div>
        </div>
      </main>
      <nav class="bar" aria-label="Presenter controls">
        <button id="p-mic" class="ctl" type="button" aria-pressed="false" title="Microphone">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/><path class="slash" d="M4 4l16 16"/></svg>Mic
        </button>
        <button id="p-cam" class="ctl" type="button" aria-pressed="false" title="Camera">
          <svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10Zm2 3 4-3v8l-4-3v-2Z"/><path class="slash" d="M4 4l16 16"/></svg>Camera
        </button>
        <button id="p-screen" class="ctl" type="button" aria-pressed="false" title="Share your screen">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v11H3V5Zm2 2v7h14V7H5Zm3 11h8v2H8v-2Z"/></svg>Screen
        </button>
        <button id="p-leave" class="ctl danger" type="button" title="Stop presenting">
          <svg viewBox="0 0 24 24"><path d="M10 4h9v16h-9v-2h7V6h-7V4Zm-1 4 1.4 1.4L8.8 11H15v2H8.8l1.6 1.6L9 16l-4-4 4-4Z"/></svg>End
        </button>
      </nav>
    </section>

    <!-- Viewer -->
    <section id="watch" class="call" hidden>
      <header class="topbar">
        <span class="brand"><span class="logo">▦</span> Tessera</span>
        <span class="room-name" data-room></span>
        <span class="status" data-status role="status">disconnected</span>
        <button id="w-leave" class="ghost" type="button">Leave</button>
      </header>
      <div class="watch-body">
        <aside class="presenters" aria-label="Presenters">
          <div class="presenters-head">
            <b id="live-count">0 live</b>
            <button id="watch-all" class="ghost small" type="button">Watch all</button>
          </div>
          <ul id="presenter-list"></ul>
          <p class="muted empty" id="no-presenters">No one is live yet. This list updates by itself.</p>
        </aside>
        <main class="stage" id="watch-stage" data-count="0">
          <p class="muted empty stage-empty" id="stage-empty"></p>
        </main>
      </div>
    </section>

    <p id="toast" class="toast" role="status" hidden></p>
    <script type="module" src="/src/live.ts"></script>
  </body>
</html>
