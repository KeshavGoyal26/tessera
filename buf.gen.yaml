# Generates the checked-in Go code. Run: buf generate   (or: make proto)
# Requires protoc-gen-go on PATH: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
# TypeScript is generated by sdk/js/buf.gen.yaml; Java is generated by Maven (sdk/java/pom.xml).
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
inputs:
  - directory: proto
